version: "3.9"

services:
  db:
    image: postgres:16
    container_name: app-db
    environment:
      POSTGRES_USER: app-user
      POSTGRES_PASSWORD: securedpass!
      POSTGRES_DB: docker-learning-db
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: auth-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: auth-backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: authuser
      DB_PASS: auth123
      DB_NAME: docker-learning-db
    depends_on:
      - db
      - redis
    ports:
      - "8000:3000"

  frontend:
    build: ./frontend
    container_name: auth-frontend
    environment:
      VITE_API_URL: http://backend:3000
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
